[package]
name = "fleetd-mcp"
version = "0.1.0"
edition = "2024"
description = "The MCP surface for fleetd's invocation-scoped message publishing"
license = "MIT"

# A surface, named for its mechanism, and a peer of `fleetd-http`. What a grant
# permits is decided in `fleetd-execution`; this crate binds a port and
# describes a tool.
[dependencies]
axum = "0.8"
fleetd-execution = { path = "../execution" }
fleetd-kernel = { path = "../kernel" }
fleetd-plugin-host = { path = "../plugin-host" }
fleetd-proto = { path = "../proto" }
rmcp = { version = "3.1.4", features = ["transport-streamable-http-server"] }
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
tokio-util = { version = "0.7" }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rmcp = { version = "3.1.4", features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest = "0.12"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
