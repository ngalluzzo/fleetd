[package]
name = "fleetd-plugin-host"
version = "0.1.0"
edition = "2024"
description = "Out-of-process plugin lifecycle and the typed fleetd.harness-acp client"
license = "MIT"

# The host launches and drives plugin processes. It owns no durable state, so
# nothing that opens a database belongs here.
[dependencies]
fleetd-proto = { path = "../proto" }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
