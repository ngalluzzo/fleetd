[package]
name = "fleetd"
version = "0.1.0"
edition = "2024"
default-run = "fleetd"
description = "A local-first control plane for cooperating software agents"
license = "MIT"

[workspace]
members = [
    ".",
    "crates/acp-host",
    "crates/conversation",
    "crates/kernel",
    "crates/plugin-host",
    "crates/proto",
    "plugins/acp-reference",
    "plugins/codex",
    "plugins/opencode",
    "tools/soak",
]
resolver = "2"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
fleetd-conversation = { path = "crates/conversation" }
fleetd-kernel = { path = "crates/kernel" }
fleetd-plugin-host = { path = "crates/plugin-host" }
fleetd-proto = { path = "crates/proto" }
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
getrandom = "0.3"
reqwest = { version = "0.12", features = ["json"] }
rmcp = { version = "3.1.4", features = ["transport-streamable-http-server"] }
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
sqlx = { version = "0.8", features = ["migrate", "runtime-tokio", "sqlite"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.29"
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5.5.0", features = ["axum_extras"] }
utoipa-axum = "0.2.0"
uuid = { version = "1", features = ["serde", "v4"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal"] }

[dev-dependencies]
rmcp = { version = "3.1.4", features = ["client", "transport-streamable-http-client-reqwest"] }
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
