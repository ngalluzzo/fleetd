[package]
name = "fleetd-author-review"
version = "0.0.1"
edition = "2024"
description = "Draft external author-review workflow dogfood for Fleetd"
license = "MIT"

[lib]
name = "fleetd_author_review"
path = "src/lib.rs"

[[bin]]
name = "fleetd-author-review-plugin"
path = "src/bin/plugin.rs"

[[bin]]
name = "fleetd-author-review-runner"
path = "src/bin/runner.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
fleetd-proto = { path = "../../crates/proto" }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]
axum = "0.8"
fleetd = { path = "../.." }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
