[package]
name = "fleetd-acp-reference"
version = "0.1.0"
edition = "2024"
description = "Development reference plugin for ACP-backed fleetd harnesses"
license = "MIT"

[dependencies]
fleetd = { path = "../.." }
fleetd-acp-host = { path = "../../crates/acp-host" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
