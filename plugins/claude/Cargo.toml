[package]
name = "fleetd-harness-claude"
version = "0.1.0"
edition = "2024"
description = "Claude Code harness plugin for fleetd"
license = "MIT"

[dependencies]
fleetd-acp-host = { path = "../../crates/acp-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
