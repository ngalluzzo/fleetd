[package]
name = "fleetd-soak"
version = "0.1.0"
edition = "2024"
description = "Evidence-preserving workload driver for Fleetd qualification runs"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
fleetd-proto = { path = "../../crates/proto" }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "time"] }

[dev-dependencies]
axum = "0.8"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
