name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow reuses this one, so a tag cannot publish artifacts
  # that the ordinary checks have not passed.
  workflow_call:

# One in-flight run per ref. A superseded pull request push stops burning
# runners; pushes to main always finish so the branch has a complete record.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Record toolchain
        run: |
          rustc --version
          cargo --version

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # The three commands CONTRIBUTING.md asks every contributor to run.
      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --all-features

      # The unit and integration suites run in-process. This one hard-kills a
      # daemon and a worker as separate processes and checks that the restarted
      # pair adopts the native session under a higher owner epoch, which no
      # in-process test can prove.
      - name: Prove crash and restart recovery
        run: |
          cargo build --workspace
          examples/restart-demo/run.sh "${RUNNER_TEMP}/fleetd-restart-demo"

  javascript:
    name: javascript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # clients/typescript declares engines.node >=22.13.0.
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      # Bun is required: the apps run `bun test`, and it builds the served
      # bundle. The client's own suites run under Node, which is what its
      # engines field promises.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      # One root install for every workspace.
      - name: Install
        run: npm ci

      - name: Tests
        run: npm run test -w @fleetd/client -w @fleetd/conversation-web

      - name: Typecheck
        run: npm run typecheck -w @fleetd/client -w @fleetd/conversation-web

      # Every committed generated artifact must match the source it came from:
      # the client against the contract, the served bundle against the app, and
      # the client's version against the contract's. The daemon embeds that
      # bundle, so stale UI would otherwise ship with a green build.
      - name: Generated artifacts match their sources
        run: npm run verify:generated

  desktop:
    name: desktop
    # macOS is the desktop target, and `electrobun prepare` fetches a
    # platform-specific devkit that has only been exercised there.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install
        run: npm ci

      - name: Desktop tests
        run: npm run test -w @fleetd/conversation-desktop

      - name: Desktop typecheck
        run: npm run typecheck -w @fleetd/conversation-desktop
